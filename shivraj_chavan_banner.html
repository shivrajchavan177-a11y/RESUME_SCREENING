<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1584px;
    height: 396px;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
    position: relative;
    background: linear-gradient(135deg, #f7f9fc 0%, #eaf1fb 55%, #dce8f8 100%);
  }

  .bg-shapes {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    align-items: center;
    padding-left: 90px;
  }

  .divider {
    width: 5px;
    height: 210px;
    background: linear-gradient(180deg, #0b2e6b, #1e6fe0);
    border-radius: 4px;
    margin-right: 36px;
  }

  .text-block {
    display: flex;
    flex-direction: column;
  }

  .first-name {
    font-size: 64px;
    font-weight: 900;
    color: #0a2a5e;
    letter-spacing: 2px;
    line-height: 1;
  }

  .last-name {
    font-size: 64px;
    font-weight: 900;
    color: #1a73f0;
    letter-spacing: 2px;
    line-height: 1.05;
    margin-bottom: 18px;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 14px;
    border-top: 2px solid #b9cbe8;
    padding-top: 16px;
    position: relative;
    width: fit-content;
  }

  .title-row::after {
    content: "";
    position: absolute;
    right: -14px;
    top: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1a73f0;
  }

  .title-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #123a7a, #1a73f0);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .title-text {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 6px;
    color: #17325c;
  }

  .skills-row {
    display: flex;
    align-items: center;
    gap: 34px;
    margin-top: 26px;
    padding-top: 20px;
  }

  .skill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: #16253d;
  }
</style>
</head>
<body>

  <svg class="bg-shapes" width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
    <circle cx="90" cy="330" r="230" fill="#ffffff" opacity="0.55"/>
    <circle cx="60" cy="250" r="150" fill="#dbe8fb" opacity="0.6"/>
    <path d="M0,396 L0,180 Q120,80 260,180 T520,140 L520,396 Z" fill="#c9defa" opacity="0.35"/>

    <!-- world map dots, top right -->
    <g fill="#a9c6ef" opacity="0.55">
      <circle cx="1230" cy="55" r="3"/><circle cx="1250" cy="45" r="3"/><circle cx="1270" cy="60" r="3"/>
      <circle cx="1290" cy="40" r="3"/><circle cx="1310" cy="55" r="3"/><circle cx="1330" cy="45" r="3"/>
      <circle cx="1210" cy="75" r="3"/><circle cx="1230" cy="80" r="3"/><circle cx="1250" cy="75" r="3"/>
      <circle cx="1270" cy="85" r="3"/><circle cx="1290" cy="80" r="3"/><circle cx="1310" cy="90" r="3"/>
      <circle cx="1330" cy="80" r="3"/><circle cx="1350" cy="70" r="3"/><circle cx="1370" cy="60" r="3"/>
      <circle cx="1190" cy="100" r="3"/><circle cx="1210" cy="110" r="3"/><circle cx="1230" cy="105" r="3"/>
      <circle cx="1250" cy="115" r="3"/><circle cx="1270" cy="110" r="3"/><circle cx="1290" cy="120" r="3"/>
      <circle cx="1310" cy="115" r="3"/><circle cx="1330" cy="110" r="3"/><circle cx="1350" cy="100" r="3"/>
      <circle cx="1440" cy="60" r="3"/><circle cx="1460" cy="70" r="3"/><circle cx="1480" cy="55" r="3"/>
      <circle cx="1500" cy="65" r="3"/><circle cx="1440" cy="90" r="3"/><circle cx="1460" cy="100" r="3"/>
      <circle cx="1480" cy="95" r="3"/><circle cx="1500" cy="105" r="3"/><circle cx="1520" cy="90" r="3"/>
    </g>

    <!-- growth line + bar chart, bottom right -->
    <polyline points="1090,220 1140,190 1190,205 1240,160 1290,175 1340,120 1410,60"
      fill="none" stroke="#3d84f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1090" cy="220" r="6" fill="#3d84f0"/>
    <circle cx="1140" cy="190" r="6" fill="#3d84f0"/>
    <circle cx="1190" cy="205" r="6" fill="#3d84f0"/>
    <circle cx="1240" cy="160" r="6" fill="#3d84f0"/>
    <circle cx="1290" cy="175" r="6" fill="#3d84f0"/>
    <circle cx="1340" cy="120" r="6" fill="#3d84f0"/>

    <path d="M1400,55 L1420,60 L1415,80 Z" fill="#1a73f0"/>

    <rect x="1310" y="230" width="42" height="166" fill="#bcd6f8" opacity="0.85"/>
    <rect x="1362" y="200" width="42" height="196" fill="#9cc3f5" opacity="0.85"/>
    <rect x="1414" y="160" width="42" height="236" fill="#6fa5f0" opacity="0.9"/>
    <rect x="1466" y="110" width="42" height="286" fill="#3d84f0" opacity="0.95"/>
    <rect x="1518" y="70" width="42" height="326" fill="#1a5fd6"/>

    <path d="M900,396 Q1100,330 1350,396 L1584,396 L1584,300 Q1300,340 900,360 Z" fill="#bcd6f8" opacity="0.5"/>
  </svg>

  <div class="content">
    <div class="divider"></div>
    <div class="text-block">
      <div class="first-name">SHIVRAJ</div>
      <div class="last-name">CHAVAN</div>

      <div class="title-row">
        <div class="title-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="14" width="3" height="7" fill="white"/>
            <rect x="10.5" y="9" width="3" height="12" fill="white"/>
            <rect x="18" y="4" width="3" height="17" fill="white"/>
          </svg>
        </div>
        <div class="title-text">ASPIRING DATA ANALYST</div>
      </div>

      <div class="skills-row">
        <div class="skill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a73f0" stroke-width="2">
            <ellipse cx="12" cy="5" rx="8" ry="3"/>
            <path d="M4 5 v6 c0 1.66 3.58 3 8 3 s8 -1.34 8 -3 V5"/>
            <path d="M4 11 v6 c0 1.66 3.58 3 8 3 s8 -1.34 8 -3 v-6"/>
          </svg>
          SQL
        </div>
        <div class="skill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2c-4 0-4 2-4 2v3h4v1H5s-3 0-3 5 3 5 3 5h2v-3s0-3 3-3h4s3 0 3-3V4s0-2-5-2z" fill="#3776AB"/>
            <path d="M12 22c4 0 4-2 4-2v-3h-4v-1h7s3 0 3-5-3-5-3-5h-2v3s0 3-3 3H10s-3 0-3 3v5s0 2 5 2z" fill="#FFD43B"/>
          </svg>
          Python
        </div>
        <div class="skill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="3" width="20" height="18" rx="2" fill="#1D6F42"/>
            <text x="12" y="16" font-size="9" fill="white" text-anchor="middle" font-weight="700">X</text>
          </svg>
          Excel
        </div>
        <div class="skill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="4" y="12" width="4" height="8" fill="#F2C811"/>
            <rect x="10" y="7" width="4" height="13" fill="#F2C811"/>
            <rect x="16" y="3" width="4" height="17" fill="#F2C811"/>
          </svg>
          Power BI
        </div>
        <div class="skill">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a73f0" stroke-width="1.5">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3 v18 M3 12 h18 M6 6 l12 12 M6 18 l12 -12"/>
          </svg>
          Machine Learning
        </div>
      </div>
    </div>
  </div>

</body>
</html>
